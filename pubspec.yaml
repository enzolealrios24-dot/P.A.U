name: cris_ficha
description: "P.A.U - fichas automaticas de Ordem Paranormal com mesa sincronizada (projeto pessoal)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  http: ^1.2.2
  image: ^4.2.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/oprpg/
    - assets/data/sah/
    - assets/data/as1/
    - assets/data/as2/
    - assets/data/as3/
    - assets/data/as4/
    - assets/data/as5/
    - assets/data/as6/
    - assets/data/as7/
    - assets/data/as9/
