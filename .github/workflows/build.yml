name: Build C.R.I.S

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash ci/prepare.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    needs: analisar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash ci/prepare.sh
      # chave fixa para que as atualizacoes instalem por cima da versao anterior
      - run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/CRIS-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CRIS-Android
          path: dist/CRIS-Android.apk

  windows:
    needs: analisar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash ci/prepare.sh
        shell: bash
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Zip portatil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\CRIS-Windows-portatil.zip
      - name: Instalador
        shell: pwsh
        continue-on-error: true
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc ci\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: CRIS-Windows
          path: dist/*

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: C.R.I.S v1.0.${{ github.run_number }}
          body: |
            Baixe o arquivo do seu aparelho:
            - **CRIS-Android.apk**: celular Android
            - **CRIS-Instalador-Windows.exe**: instalador para Windows
            - **CRIS-Windows-portatil.zip**: Windows sem instalar (descompacte e abra cris_ficha.exe)
          files: dist/*
