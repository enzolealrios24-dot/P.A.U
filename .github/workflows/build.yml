name: Build P.A.U

on:
  push:
    branches: [main]
    # documentacao e regras do Firestore nao mudam o app
    paths-ignore:
      - '**.md'
      - firestore.rules
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash ci/prepare.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    needs: analisar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash ci/prepare.sh
      # chave fixa para que as atualizacoes instalem por cima da versao anterior
      - run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/PAU-Android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: PAU-Android
          path: dist/PAU-Android.apk

  windows:
    needs: analisar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash ci/prepare.sh
        shell: bash
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Zip portatil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\PAU-Windows-portatil.zip
      - name: Instalador
        shell: pwsh
        continue-on-error: true
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          function Find-Iscc { Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName }
          $iscc = Find-Iscc
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = Find-Iscc }
          & $iscc ci\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: PAU-Windows
          path: dist/*

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: P.A.U v1.0.${{ github.run_number }}
          body: |
            Baixe o arquivo do seu aparelho:
            - **PAU-Android.apk**: celular Android
            - **PAU-Instalador-Windows.exe**: instalador para Windows
            - **PAU-Windows-portatil.zip**: Windows sem instalar (descompacte e abra cris_ficha.exe)
          files: dist/*
