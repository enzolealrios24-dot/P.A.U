name: Build SolAutomation Native

on:
  workflow_dispatch:
  push:
    branches: [ "sol-mdg-mod-build" ]
    paths:
      - "NativeSolAutomation/**"
      - ".github/workflows/build-native-solautomation.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate mod.json
        run: python3 -m json.tool NativeSolAutomation/mod.json > /dev/null

      - name: Validate Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p NativeSolAutomation/SolAutomation.lua

      - name: Verify native-only package
        shell: bash
        run: |
          set -euo pipefail
          if find NativeSolAutomation -type f \( -iname '*.dll' -o -iname '*.exe' \) | grep -q .; then
            echo "Native package unexpectedly contains executable binaries."
            exit 1
          fi
          test -f NativeSolAutomation/mod.json
          test -f NativeSolAutomation/SolAutomation.lua

      - uses: actions/upload-artifact@v4
        with:
          name: SolAutomation-Native-0.1.0
          path: |
            NativeSolAutomation/mod.json
            NativeSolAutomation/SolAutomation.lua
            NativeSolAutomation/LEIA-ME.txt
          if-no-files-found: error
