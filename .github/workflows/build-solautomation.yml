name: Build SolAutomation

on:
  workflow_dispatch:
  push:
    branches: [ "sol-mdg-mod-build" ]
    paths:
      - "SolAutomation/**"
      - ".github/workflows/build-solautomation.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Prepare dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force SolAutomation/deps/melon | Out-Null
          New-Item -ItemType Directory -Force SolAutomation/deps/msm | Out-Null

          Invoke-WebRequest "https://github.com/LavaGang/MelonLoader/releases/download/v0.7.3/MelonLoader.x64.zip" -OutFile melon.zip
          Expand-Archive melon.zip -DestinationPath SolAutomation/deps/melon -Force

          Invoke-WebRequest "https://github.com/Echo5Dev/MDRG-ModSettingsMenu/releases/download/v1.1.1/ModSettingsMenu.zip" -OutFile msm.zip
          Expand-Archive msm.zip -DestinationPath SolAutomation/deps/msm -Force

          $msm = Get-ChildItem SolAutomation/deps/msm -Recurse -Filter ModSettingsMenu.dll | Select-Object -First 1
          if (-not $msm) { throw "ModSettingsMenu.dll not found" }
          Copy-Item $msm.FullName SolAutomation/deps/ModSettingsMenu.dll -Force

      - name: Build
        shell: pwsh
        run: dotnet build SolAutomation/SolAutomation.csproj -c Release

      - name: Package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force package/Mods | Out-Null
          New-Item -ItemType Directory -Force package/THIRD_PARTY_LICENSES | Out-Null

          Copy-Item SolAutomation/bin/Release/SolAutomation.dll package/Mods/SolAutomation.dll
          Copy-Item SolAutomation/deps/ModSettingsMenu.dll package/Mods/ModSettingsMenu.dll

          # Use MelonLoader CI build that contains the UnityPlayer/proxy load-order race fix.
          $headers = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/LavaGang/MelonLoader/actions/artifacts/11128818214/zip" -OutFile patched-melon.zip
          Expand-Archive patched-melon.zip -DestinationPath patched-melon -Force
          Write-Host "Patched MelonLoader artifact contents:"
          Get-ChildItem patched-melon -Recurse | Select-Object FullName
          Copy-Item patched-melon/* package -Recurse -Force

          Invoke-WebRequest "https://raw.githubusercontent.com/Echo5Dev/MDRG-ModSettingsMenu/main/LICENSE" -OutFile package/THIRD_PARTY_LICENSES/ModSettingsMenu-MIT.txt
          Invoke-WebRequest "https://raw.githubusercontent.com/LavaGang/MelonLoader/master/LICENSE.md" -OutFile package/THIRD_PARTY_LICENSES/MelonLoader-Apache-2.0.txt

          @"
          SOL AUTOMATION 0.3.1

          Compatibilidade alvo:
          - My Dystopian Robot Girlfriend 0.97.x
          - MelonLoader 0.7.4-ci.2601 (patch do carregamento UnityPlayer)

          INSTALAÇÃO MANUAL
          1. Feche o jogo completamente.
          2. Abra a pasta onde está "My Dystopian Robot Girlfriend.exe".
          3. Extraia TODO o conteúdo deste ZIP diretamente nessa pasta.
          4. Quando o Windows perguntar sobre mesclar/substituir pastas, aceite a mesclagem.
          5. Confirme que ficaram ao lado do .exe:
             - version.dll
             - pasta MelonLoader
             - pasta Mods
          6. Abra o jogo normalmente.
          7. Na primeira abertura, o MelonLoader pode demorar para preparar os assemblies IL2CPP.
          8. A janela do MelonLoader deve mostrar 0.7.4-ci.2601 ou uma identificação equivalente dessa build.
          
          Esta build específica inclui o commit b983882e468bcfbaab7959f1a1e98cc841ed579c,
          que corrige a corrida de carregamento entre Bootstrap/Proxy e UnityPlayer.

          STREAMING
          Options > Mod Settings Menu > Sol Automation
          Ative "Pular streaming automaticamente".

          PESCA
          Durante o minigame de pesca:
          - clique no botão AUTO PESCA; ou
          - pressione P.

          IMPORTANTE
          Esta DLL foi compilada automaticamente no GitHub Actions.
          A compilação é verificada, mas o comportamento dentro da sua cópia do jogo
          ainda precisa ser validado em runtime. Se algum controle não for detectado,
          envie o MelonLoader/Latest.log depois de testar.
          "@ | Set-Content package/LEIA-ME.txt -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: SolAutomation-0.3.1-PatchedLoader
          path: package/
